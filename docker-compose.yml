version: '3.8'

services:
  backend:
    build:
      context: ./memwebapp/backend
      dockerfile: Dockerfile
    container_name: memoapp_backend
    ports:
      - "8002:8002"
    env_file:
      - ./memwebapp/backend/.env
    restart: always
    environment:
      - PORT=8002
      - NODE_ENV=production

  frontend:
    build:
      context: ./memwebapp/frontend
      dockerfile: Dockerfile
    container_name: memoapp_frontend
    ports:
      - "5173:80"
    restart: always
  db:
    image: postgres:15
    container_name: memoapp_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: memoapp
      POSTGRES_PASSWORD: memoapp_secure_2026
      POSTGRES_DB: memoapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
